<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToDoリスト プレビュー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  /* app/page.tsx の見た目を再現した静的プレビュー(VS Code Live Preview 用) */
  :root {
    --bg: #f8fafc; --surface: #ffffff; --fg: #1e293b; --muted: #64748b; --faint: #94a3b8;
    --line: #e2e8f0; --line-soft: #f1f5f9; --hover: #f8fafc;
    --accent: #4f46e5; --accent-hover: #4338ca; --ring: #e0e7ff; --accent-border: #818cf8;
    --danger: #dc2626; --danger-bg: #fef2f2; --note-bg: #eef2ff; --note-fg: #3730a3;
    --font: "Noto Sans JP", ui-sans-serif, system-ui, sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  main { max-width: 36rem; margin: 0 auto; padding: 3rem 16px; }
  @media (min-width: 640px) { main { padding-block: 5rem; } }

  .note { font-size: 12px; background: var(--note-bg); color: var(--note-fg); border-radius: 10px; padding: 8px 12px; margin: 0 0 2rem; line-height: 1.6; }
  h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .count { margin: 4px 0 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  header { margin-bottom: 2rem; }

  form { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  #new-task { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; outline: none;
    box-shadow: 0 1px 2px rgb(0 0 0 / .05); transition: border-color .15s, box-shadow .15s; }
  #new-task::placeholder { color: var(--faint); }
  #new-task:focus { border-color: var(--accent-border); box-shadow: 0 0 0 4px var(--ring); }
  .add { font: inherit; font-weight: 500; color: #fff; background: var(--accent); border: 0; border-radius: 12px;
    padding: 12px 20px; cursor: pointer; transition: background .15s, opacity .15s; }
  .add:hover:not(:disabled) { background: var(--accent-hover); }
  .add:disabled { opacity: .4; cursor: not-allowed; }
  .add:focus-visible, .del:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; transition: background .15s; }
  li + li { border-top: 1px solid var(--line-soft); }
  li:hover { background: var(--hover); }
  li input { width: 20px; height: 20px; flex-shrink: 0; cursor: pointer; accent-color: var(--accent); margin: 0; }
  .text { flex: 1; min-width: 0; overflow-wrap: anywhere; transition: color .15s; }
  li.done .text { color: var(--faint); text-decoration: line-through; }
  .del { font: inherit; font-size: 14px; color: var(--faint); background: none; border: 0; border-radius: 8px;
    padding: 4px 8px; cursor: pointer; transition: all .15s; }
  .del:hover { background: var(--danger-bg); color: var(--danger); }
  @media (min-width: 640px) { .del { opacity: 0; } li:hover .del, .del:focus { opacity: 1; } }

  .empty { border: 1px dashed var(--line); border-radius: 16px; padding: 3rem 0; text-align: center;
    font-size: 14px; color: var(--faint); background: var(--surface); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <p class="note">静的プレビュー版です。Next.js版(app/page.tsx)の見た目・動作を再現しています。最初の3件はサンプルです。</p>
  <header>
    <h1>ToDoリスト</h1>
    <p class="count" id="count"></p>
  </header>
  <form id="form">
    <input id="new-task" type="text" placeholder="新しいタスクを入力" aria-label="新しいタスク" autocomplete="off">
    <button class="add" id="add" type="submit" disabled>追加</button>
  </form>
  <div id="list"></div>
</main>

<script>
  const KEY = "todos-preview";
  const sample = [
    { id: "s1", text: "牛乳を買う(サンプル)", done: true },
    { id: "s2", text: "企画書のドラフトを書く(サンプル)", done: false },
    { id: "s3", text: "歯医者の予約をする(サンプル)", done: false },
  ];
  let todos = sample;
  try { const s = localStorage.getItem(KEY); if (s) todos = JSON.parse(s); } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const input = $("new-task"), addBtn = $("add"), list = $("list"), count = $("count");

  function save() { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} }
  const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));

  function render() {
    const remaining = todos.filter((t) => !t.done).length;
    count.textContent = todos.length === 0 ? "タスクを追加しましょう" : `残り ${remaining} 件 / 全 ${todos.length} 件`;
    list.replaceChildren();
    if (todos.length === 0) {
      const d = document.createElement("div");
      d.className = "empty"; d.textContent = "タスクはまだありません";
      list.append(d); return;
    }
    const ul = document.createElement("ul");
    for (const t of todos) {
      const li = document.createElement("li");
      if (t.done) li.className = "done";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = t.done;
      cb.setAttribute("aria-label", `「${t.text}」を${t.done ? "未完了" : "完了"}にする`);
      cb.onchange = () => { todos = todos.map((x) => x.id === t.id ? { ...x, done: !x.done } : x); save(); render(); };
      const span = document.createElement("span");
      span.className = "text"; span.textContent = t.text;
      const del = document.createElement("button");
      del.type = "button"; del.className = "del"; del.textContent = "削除";
      del.setAttribute("aria-label", `「${t.text}」を削除`);
      del.onclick = () => { todos = todos.filter((x) => x.id !== t.id); save(); render(); };
      li.append(cb, span, del); ul.append(li);
    }
    list.append(ul);
  }

  input.addEventListener("input", () => { addBtn.disabled = !input.value.trim(); });
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos = [...todos, { id: uid(), text, done: false }];
    input.value = ""; addBtn.disabled = true;
    save(); render();
  });
  render();
</script>
</body>
</html>
